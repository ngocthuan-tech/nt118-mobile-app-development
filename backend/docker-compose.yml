# Chạy trên máy ảo Azure:  cd backend && docker compose up -d --build
# Cần file .env cùng thư mục (copy từ .env.example rồi điền).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aicoach
      POSTGRES_USER: aicoach
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Thieu DB_PASSWORD trong file .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicoach -d aicoach"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Không mở cổng database ra Internet — chỉ container api nói chuyện được với db.

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/aicoach
      DB_USER: aicoach
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Thieu JWT_SECRET trong file .env}
      SEED_DEMO: ${SEED_DEMO:-true}
      JAVA_OPTS: -Xms128m -Xmx384m

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Thieu API_DOMAIN trong file .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
