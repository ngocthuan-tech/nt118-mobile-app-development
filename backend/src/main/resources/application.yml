server:
  port: 8080
  # Chạy sau Caddy (HTTPS) — đọc X-Forwarded-* để Swagger sinh đúng link https
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      force: true
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: aicoach-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aicoach}
    username: ${DB_USER:aicoach}
    password: ${DB_PASSWORD:aicoach}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      # Cấu trúc bảng do Flyway tạo (db/migration/V*.sql). Hibernate chỉ KIỂM TRA entity khớp với bảng,
      # lệch là server từ chối khởi động — không bao giờ tự sửa bảng.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Database trên server đã có bảng từ trước (Hibernate tạo) → đánh dấu là V1 rồi chạy tiếp V2 trở đi.
    # Database trống → chạy từ V1.
    baseline-on-migrate: true
    baseline-version: 1
  # Gửi email mã quên mật khẩu. Để trống MAIL_HOST = không gửi email, mã ghi vào log server.
  # Gmail: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_USERNAME=<gmail>, MAIL_PASSWORD=<Mật khẩu ứng dụng 16 ký tự>
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Bắt buộc ≥ 32 ký tự, đặt qua biến môi trường JWT_SECRET (không ghi vào code)
    secret: ${JWT_SECRET:}
    expiration-days: 7
  seed:
    demo: ${SEED_DEMO:true}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.hibernate.SQL: warn
