name: Backend CI

on:
  push:
    branches: [main, develop, "feature/**"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test + build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # Database PostgreSQL thật cho test — giống hệt server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aicoach_test
          POSTGRES_USER: aicoach
          POSTGRES_PASSWORD: aicoach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aicoach -d aicoach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Chạy Flyway + test trên PostgreSQL
        run: mvn -B verify

      - name: Build Docker image
        run: docker build -t aicoach-api .
